name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust locally
        run: bash scripts/bootstrap-rust.sh
      - name: Core format, lint and tests
        env:
          CARGO_HOME: ${{ github.workspace }}/.work/cargo
        run: |
          export PATH="$PWD/.work/toolchain/bin:$PATH"
          cargo fmt --all -- --check
          cargo clippy -p typedsolid-core --all-targets --locked -- -D warnings
          cargo test -p typedsolid-core --locked
      # 欠陥fixtureの断面図をCadQueryを使わずに再生成し、docsの図と一致することを確かめる。
      # 検出箇所の表はjob summaryに書く。maturinだけを入れ、artifactのactionは使わない。
      - name: Section figures
        run: |
          python3.12 -m venv .venv
          .venv/bin/python -m pip install --require-hashes --only-binary :all: -r requirements-figures.lock
          export PATH="$PWD/.work/toolchain/bin:$PWD/.venv/bin:$PATH"
          export CARGO_HOME="$PWD/.work/cargo"
          export PYO3_PYTHON="$PWD/.venv/bin/python"
          export VIRTUAL_ENV="$PWD/.venv"
          maturin develop --locked
          python scripts/render-figures.py --output .work/figures-ci --defects-only --summary "$GITHUB_STEP_SUMMARY"
          diff -r docs/assets/figures .work/figures-ci

  integration:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust locally
        run: bash scripts/bootstrap-rust.sh
      - name: Python environment
        run: |
          python3.12 -m venv .venv
          .venv/bin/python -m pip install --require-hashes --only-binary :all: -r requirements-dev.lock
      - name: Check Rust and Python integration
        run: |
          export PATH="$PWD/.work/toolchain/bin:$PWD/.venv/bin:$PATH"
          export CARGO_HOME="$PWD/.work/cargo"
          export PYO3_PYTHON="$PWD/.venv/bin/python"
          export VIRTUAL_ENV="$PWD/.venv"
          export TMPDIR="$PWD/.work/tmp"
          mkdir -p "$TMPDIR"
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test -p typedsolid-core --locked
          maturin develop --locked
          python -m unittest discover -s tests -v
          python examples/board_tray.py --output .work/board-tray
